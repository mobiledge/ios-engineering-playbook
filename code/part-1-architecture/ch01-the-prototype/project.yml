# XcodeGen project specification for Medley.
#
# Generate the .xcodeproj with:
#     brew install xcodegen   # one time
#     cd code/part-1-architecture/ch01-the-prototype
#     xcodegen generate
#     open Medley.xcodeproj
#
# Part I, Chapter 1 is the prototype: everything lives in ONE file in ONE
# application target. Structure must earn its place — later chapters extract
# it one Single-Responsibility at a time.
#
# The MedleyTests target is here from day one, empty on purpose: there is
# nothing in the prototype a unit test can reach yet.

name: Medley

options:
  bundleIdPrefix: com.medley
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Medley:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medley.app
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Let Xcode synthesize Info.plist so there is no file to hand-maintain.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    scheme:
      testTargets:
        - MedleyTests

  MedleyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/MedleyTests
    dependencies:
      - target: Medley
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medley.app.tests
        GENERATE_INFOPLIST_FILE: YES
