# XcodeGen project specification for Medley.
#
# Generate the .xcodeproj with:
#     brew install xcodegen   # one time
#     cd code/part-1-architecture/ch04-view-composition
#     xcodegen generate
#     open Medley.xcodeproj
#
# Part I, Chapter 4: one application target. The music screen lives in
# Sources/Features/Music/ (MusicSearchView + TrackRow), the one reusable
# component in Sources/DesignSystem/ (ArtworkView). API responses decode into
# Sources/Models/, and the network lives in Sources/Networking/.
#
# MedleyTests uses Swift Testing. The .json fixtures under
# Tests/MedleyTests/Fixtures/ are picked up as bundle resources automatically,
# and Tests/MedleyTests/Support/ holds test-only helpers (StubURLProtocol).

name: Medley

options:
  bundleIdPrefix: com.medley
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Medley:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medley.app
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Let Xcode synthesize Info.plist so there is no file to hand-maintain.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    scheme:
      testTargets:
        - MedleyTests

  MedleyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/MedleyTests
    dependencies:
      - target: Medley
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medley.app.tests
        GENERATE_INFOPLIST_FILE: YES
