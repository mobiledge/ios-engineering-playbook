# XcodeGen project specification — Chapter 4: Vertical Slicing.
#
# Generate the .xcodeproj with:
#     brew install xcodegen   # one time
#     cd code/part-2-modular/ch04-vertical-slicing
#     xcodegen generate
#     open iTunesSearchApp.xcodeproj
#
# Music, Podcasts, and Library are each their own package now
# (FeatureMusicSearch, FeaturePodcasts, FeatureLibrary), on top of the
# horizontal layers from Chapters 2-3 (DesignSystem, Domain, Infrastructure).
# The app target only composes the three features into a TabView.
# FeatureLibraryDemo is a tiny standalone app that boots straight into
# FeatureLibrary alone — the fast inner loop this chapter is about.

name: iTunesSearchApp

options:
  bundleIdPrefix: com.playbook
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

# Local Swift packages, referenced by path.
packages:
  DesignSystem:
    path: Packages/DesignSystem
  Domain:
    path: Packages/Domain
  Infrastructure:
    path: Packages/Infrastructure
  FeatureMusicSearch:
    path: Packages/FeatureMusicSearch
  FeaturePodcasts:
    path: Packages/FeaturePodcasts
  FeatureLibrary:
    path: Packages/FeatureLibrary

targets:
  iTunesSearchApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: DesignSystem
      - package: Domain
      - package: Infrastructure
      - package: FeatureMusicSearch
      - package: FeaturePodcasts
      - package: FeatureLibrary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playbook.iTunesSearchApp
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Let Xcode synthesize Info.plist so there is no file to hand-maintain.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  # A standalone catalog app that imports ONLY the DesignSystem. Designers and
  # developers can run this to review components in isolation from the app's
  # business logic and network — one of the big payoffs of the extraction.
  Catalog:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Catalog
    dependencies:
      - package: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playbook.Catalog
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  # This chapter's "preview app": compiles only FeatureLibrary and its
  # dependencies (Domain, Infrastructure, DesignSystem) — never
  # FeatureMusicSearch or FeaturePodcasts. The Library squad can build and
  # run this without booting the rest of the app.
  FeatureLibraryDemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DemoApps/FeatureLibraryDemo
    dependencies:
      - package: FeatureLibrary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playbook.FeatureLibraryDemo
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
