# XcodeGen project specification — Chapter 7: The Proof.
#
# Generate the .xcodeproj with:
#     brew install xcodegen   # one time
#     cd code/part-2-modular/ch07-the-proof
#     xcodegen generate
#     open iTunesSearchApp.xcodeproj
#
# The module graph is unchanged from Chapter 6 except one swap: the retired
# feature package is gone, `FeatureAudiobooks` takes its place
# (FeatureMusicSearch, FeatureMovies, FeatureLibrary, FeatureAudiobooks;
# Domain, DesignSystem, AppInterfaces, Infrastructure). Construction still
# lives in `Sources/App/CompositionRoot/{AppFactory,AppRouter}`; `RootView`
# is still a trivial TabView over factory-made screens, and
# `FeatureLibraryDemo` still gets its own tiny composition root.

name: iTunesSearchApp

options:
  bundleIdPrefix: com.playbook
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # Chapter 1's MOCK_SERVICES seed, still alive: Debug builds pick the mock
    # feature-flag set via `AppFactory`'s `flags` default, below.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG MOCK_SERVICES
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

# Local Swift packages, referenced by path.
packages:
  DesignSystem:
    path: Packages/DesignSystem
  Domain:
    path: Packages/Domain
  Infrastructure:
    path: Packages/Infrastructure
  AppInterfaces:
    path: Packages/AppInterfaces
  FeatureMusicSearch:
    path: Packages/FeatureMusicSearch
  FeatureMovies:
    path: Packages/FeatureMovies
  FeatureLibrary:
    path: Packages/FeatureLibrary
  FeatureAudiobooks:
    path: Packages/FeatureAudiobooks

targets:
  iTunesSearchApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: DesignSystem
      - package: Domain
      - package: Infrastructure
      - package: AppInterfaces
      - package: FeatureMusicSearch
      - package: FeatureMovies
      - package: FeatureLibrary
      - package: FeatureAudiobooks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playbook.iTunesSearchApp
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Let Xcode synthesize Info.plist so there is no file to hand-maintain.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  # A standalone catalog app that imports ONLY the DesignSystem. Designers and
  # developers can run this to review components in isolation from the app's
  # business logic and network — one of the big payoffs of the extraction.
  Catalog:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Catalog
    dependencies:
      - package: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playbook.Catalog
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  # This chapter's "preview app": compiles only FeatureLibrary and its
  # dependencies (Domain, DesignSystem, AppInterfaces) — never
  # FeatureMusicSearch, FeatureMovies, or FeatureAudiobooks. It also links
  # Infrastructure directly, to construct a real Core Data repository —
  # it is a miniature composition root. The Library squad can build and run
  # this without booting the rest of the app.
  FeatureLibraryDemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DemoApps/FeatureLibraryDemo
    dependencies:
      - package: FeatureLibrary
      - package: Infrastructure
      - package: AppInterfaces
      - package: Domain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playbook.FeatureLibraryDemo
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
